<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monthly Todo">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Monthly Todo 手帳版</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf9f6;color:#403b36;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.app{max-width:1100px;margin:auto;padding:14px 7px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{font-family:Georgia,"Yu Mincho",serif;font-size:23px;margin:0}
button{font:inherit;cursor:pointer}
.nav{display:flex;align-items:center;gap:6px}
.nav button,.add{width:40px;height:40px;border:1px solid #ddd7cf;background:#fffefa;border-radius:10px}
.month{min-width:105px;text-align:center;font-weight:600}
.calendar{background:#fffefa;border:1px solid #ddd7cf;border-radius:9px;overflow:hidden}
.weekhead,.days{display:grid;grid-template-columns:repeat(7,1fr)}
.weekhead div{text-align:center;padding:8px 0;border-right:1px solid #ddd7cf;font-size:11px}
.weekhead div:last-child{border:0}.sun{color:#d84a42}.sat{color:#3169b5}
.week{position:relative;border-bottom:1px solid #ddd7cf;height:140px;min-height:140px}
.week:last-child{border:0}
.days{height:140px;min-height:140px}
.day{height:140px;min-height:140px;overflow:hidden;border-right:1px solid #ddd7cf;position:relative;padding:5px 6px;cursor:pointer}
.day:last-child{border:0}
.other{background:#faf8f3}
.num{font-size:12px;font-weight:600;position:relative;z-index:10;display:flex;align-items:center;min-height:23px}
.num.sun{color:#d84a42}.num.sat{color:#3169b5}
.holiday .num{color:#d84a42}
.today .num{background:#686d66;color:#fff;border-radius:50%;width:23px;height:23px;justify-content:center}
.today.holiday .num{background:#d84a42;color:#fff}
.shift{position:absolute;top:4px;right:4px;z-index:11;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:400;line-height:1;white-space:nowrap;letter-spacing:0;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.shift.s-none{display:none}
.shift.s-a{color:#fff;background:#5d8fca}.shift.s-b{color:#fff;background:#5c9aa9}.shift.s-c1{color:#fff;background:#6ba4a8}.shift.s-d{color:#fff;background:#c99a4d}.shift.s-e{color:#fff;background:#8264a0}.shift.s-h{color:#fff;background:#d2779b}
.shift.s-week,.shift.s-furi{color:#fff;background:#68a07a}.shift.s-depart{color:#fff;background:#b48a4f}.shift.s-work{color:#fff;background:#b86666}.shift.s-off{color:#fff;background:#888}
.bars{position:absolute;inset:0;pointer-events:none}
.bar{position:absolute;height:23px;line-height:23px;border:0;border-radius:0;padding:0 7px;color:#49433d;font-size:10px;white-space:nowrap;overflow:hidden;z-index:5;pointer-events:auto;text-align:left}
.bar.start{border-radius:5px 0 0 5px}
.bar.end{padding-right:22px;clip-path:polygon(0 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,0 100%)}
.bar.single{border-radius:6px;padding-right:7px;clip-path:none}
.bar.done{opacity:.38;text-decoration:line-through}
.label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.bar:not(.start) .label{display:none}
.bar.compact{height:18px;line-height:18px;font-size:8px}
.bar.compact.end{padding-right:18px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
.day.has-many .bar{height:18px;line-height:18px;font-size:8px}
.day.has-many .bar.end{padding-right:18px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
.hint{text-align:center;font-size:10px;color:#8d867d;margin:8px}
.modalbg{position:fixed;inset:0;background:#0004;display:flex;align-items:center;justify-content:center;padding:15px;z-index:30}
.modal{background:#fffefa;width:min(460px,100%);max-height:90vh;overflow:auto;border-radius:15px;padding:19px;box-shadow:0 12px 40px #0003}
.modal h2{margin:0 0 14px;font-size:18px}
.field{margin-bottom:11px}.field label{display:block;font-size:11px;color:#777067;margin-bottom:4px}
.title-row{display:flex;align-items:center;gap:9px}
.title-row input[type=checkbox]{width:21px;height:21px;accent-color:#626960;flex:0 0 auto}
.title-row input[type=text]{flex:1}
.field input[type=text],.field input[type=date]{width:100%;height:42px;border:1px solid #d0c8be;border-radius:8px;padding:7px 9px;font-size:15px}
.subs{border:1px solid #e1dad1;background:#faf8f3;border-radius:9px;padding:11px;margin:3px 0 13px}
.subhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin-bottom:7px}
.subadd{border:1px solid #d5cdc3;background:#fff;border-radius:7px;padding:5px 9px}
.subrow{display:flex;gap:6px;align-items:center;background:#f0ece6;border-radius:7px;padding:5px 6px;margin-bottom:5px;font-size:12px}
.subrow input{width:21px;height:21px;accent-color:#3f86ea;flex:0 0 auto}
.subrow span{flex:1}.subrow.done span{text-decoration:line-through;color:#aaa}.subdel{border:0;background:none;color:#a3655e}
.subinput{display:flex;gap:5px;margin-top:6px}.subinput input{flex:1;height:38px;border:1px solid #d0c8be;border-radius:7px;padding:5px}
.colors,.shifts{display:flex;gap:7px;flex-wrap:wrap}
.color{width:34px;height:34px;border-radius:8px;border:3px solid transparent}
.sel{border-color:#4b4641;box-shadow:0 0 0 2px white inset}
.shiftopt{min-width:42px;height:34px;border:1px solid #d0c8be;background:#fff;border-radius:8px;font-weight:700}
.shiftopt.sel{border-color:#4b4641;box-shadow:0 0 0 2px white inset}
.shiftopt.none{font-weight:500;color:#777}
.shiftopt.sopt-a{background:#e8f0fa;color:#3f77b7}.shiftopt.sopt-b{background:#e3f0f3;color:#3c8aa0}.shiftopt.sopt-c1{background:#e4eeee;color:#5c8b8e}.shiftopt.sopt-d{background:#f8ecd7;color:#c28b38}.shiftopt.sopt-e{background:#eee8f2;color:#76528b}.shiftopt.sopt-h{background:#f7e5ed;color:#c35f88}
.shiftopt.sopt-week,.shiftopt.sopt-furi{background:#e6f0e6;color:#4b875f}.shiftopt.sopt-depart{background:#eee6d9;color:#9a7a43}.shiftopt.sopt-work{background:#f3dddd;color:#b44e4e}.shiftopt.sopt-off{background:#eeeeee;color:#777}
.actions{display:flex;gap:7px;margin-top:16px}.actions button{min-height:40px;padding:0 13px;border:1px solid #d0c8be;background:white;border-radius:8px}
.save{background:#626960!important;color:white;border-color:#626960!important}.delete{margin-right:auto;color:#a05f59!important;border-color:#e0c8c3!important}
@media(max-width:650px){
.app{padding:10px 5px}h1{font-size:20px}
.day,.days,.week{height:140px!important;min-height:140px!important}.day{padding:5px 4px}
.bar{height:21px;line-height:21px;font-size:9px;padding-left:6px}
.bar.end{padding-right:18px;clip-path:polygon(0 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,0 100%)}
.bar.single{padding-right:6px;clip-path:none!important;border-radius:5px!important}
.bar.compact,.day.has-many .bar{height:17px;line-height:17px;font-size:7.5px}
.bar.compact.end,.day.has-many .bar.end{padding-right:15px;clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%)}
.bar.compact.single,.day.has-many .bar.single{padding-right:6px;clip-path:none!important;border-radius:5px!important}
.weekhead div{font-size:10px}.shift{width:22px;height:22px;font-size:12px;right:4px;top:4px}
}
</style>
</head>
<body>
<div class="app">
<header>
<h1>Monthly Todo</h1>
<div class="nav"><button id="prev">‹</button><div class="month" id="month"></div><button id="next">›</button></div>
<button class="add" id="addtop">＋</button>
</header>
<div class="calendar">
<div class="weekhead"><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div><div class="sun">日</div></div>
<div id="weeks"></div>
</div>
<div class="hint">日付をタップすると予定を追加　・　帯をタップすると予定を編集</div>
<div id="modal"></div>
</div>
<script>
(()=>{
const weeks=document.getElementById('weeks'),month=document.getElementById('month'),modal=document.getElementById('modal');
/* 色順：赤・ベージュ・青・緑・黄・紫 */
const C=['#e9a8b2','#ded3c3','#cbd9e5','#c9d9ca','#f1d18a','#d9d1df'];
const SHIFT=[
['','なし','none'],['A','A','a'],['B','B','b'],['C1','C1','c1'],['D','D','d'],['E','E','e'],['H','H','h'],
['週','週','week'],['振','振','furi'],['出','出','depart'],['勤','勤','work'],['休','休','off']
];
let view=new Date(2026,7,1),id=10,sid=20;
let todos=[
{id:1,title:'書類確認',start:'2026-08-01',end:'2026-08-05',color:1,done:false,subs:[{id:1,text:'記入漏れを確認',done:true},{id:2,text:'必要書類をそろえる',done:false}]},
{id:2,title:'保育計画',start:'2026-08-03',end:'2026-08-07',color:3,done:false,subs:[]},
{id:3,title:'運動会の準備',start:'2026-08-10',end:'2026-08-14',color:2,done:false,subs:[]},
{id:4,title:'園だより作成',start:'2026-08-18',end:'2026-08-21',color:0,done:false,subs:[]}
];
let shifts={"2026-08-03":"A","2026-08-18":"H"};

function pad(n){return String(n).padStart(2,'0')}
function key(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function dt(k){let a=k.split('-').map(Number);return new Date(Date.UTC(a[0],a[1]-1,a[2]))}
function diff(a,b){return Math.round((dt(b)-dt(a))/86400000)}
function save(){localStorage.setItem('monthlyTodo',JSON.stringify({todos,shifts}))}
function load(){try{const x=JSON.parse(localStorage.getItem('monthlyTodo'));if(Array.isArray(x))todos=x;else if(x&&Array.isArray(x.todos)){todos=x.todos;shifts=x.shifts||{}}}catch(e){}}
function shiftInfo(v){return SHIFT.find(s=>s[0]===v)||SHIFT[0]}

/* 日本の祝日・国民の休日・振替休日 */
function japaneseHolidays(year){
const h=new Map();
const add=(m,d,name)=>h.set(year+'-'+pad(m)+'-'+pad(d),name);
const nthMonday=(month,n)=>{
let d=new Date(year,month-1,1);
return 1+((8-d.getDay())%7)+(n-1)*7;
};
add(1,1,'元日');
add(1,nthMonday(1,2),'成人の日');
add(2,11,'建国記念の日');
add(2,23,'天皇誕生日');
const spring=Math.floor(20.8431+0.242194*(year-1980)-Math.floor((year-1980)/4));
const autumn=Math.floor(23.2488+0.242194*(year-1980)-Math.floor((year-1980)/4));
add(3,spring,'春分の日');
add(4,29,'昭和の日');
add(5,3,'憲法記念日');
add(5,4,'みどりの日');
add(5,5,'こどもの日');
add(7,nthMonday(7,3),'海の日');
add(8,11,'山の日');
add(9,nthMonday(9,3),'敬老の日');
add(9,autumn,'秋分の日');
add(10,nthMonday(10,2),'スポーツの日');
add(11,3,'文化の日');
add(11,23,'勤労感謝の日');

/* 2020・2021年の東京大会特例 */
if(year===2020){
h.delete(year+'-07-20');h.delete(year+'-10-12');h.delete(year+'-08-11');
add(7,23,'海の日');add(7,24,'スポーツの日');add(8,10,'山の日');
}
if(year===2021){
h.delete(year+'-07-19');h.delete(year+'-10-11');h.delete(year+'-08-11');
add(7,22,'海の日');add(7,23,'スポーツの日');add(8,8,'山の日');
}

/* 祝日に挟まれた平日＝国民の休日 */
const base=new Set(h.keys());
for(let m=1;m<=12;m++){
let days=new Date(year,m,0).getDate();
for(let d=2;d<days;d++){
let k=year+'-'+pad(m)+'-'+pad(d);
if(!base.has(k)&&base.has(year+'-'+pad(m)+'-'+pad(d-1))&&base.has(year+'-'+pad(m)+'-'+pad(d+1))){
h.set(k,'国民の休日');
}
}
}

/* 日曜日の祝日＝次の平日を振替休日 */
for(const [k] of [...h]){
let d=new Date(k+'T00:00:00');
if(d.getDay()!==0)continue;
d.setDate(d.getDate()+1);
while(h.has(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())))d.setDate(d.getDate()+1);
h.set(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),'振替休日');
}
return h;
}

function render(){
let y=view.getFullYear(),m=view.getMonth();
month.textContent=y+'年 '+(m+1)+'月';
weeks.innerHTML='';
let first=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate(),rows=Math.ceil((first+last)/7);
let now=new Date(),today=key(now.getFullYear(),now.getMonth(),now.getDate()),holidays={};
for(let yy=y-1;yy<=y+1;yy++)holidays[yy]=japaneseHolidays(yy);

for(let w=0;w<rows;w++){
let wk=document.createElement('div');wk.className='week';
let ds=document.createElement('div');ds.className='days';let cells=[];
for(let c=0;c<7;c++){
let n=w*7+c-first+1,yy=y,mm=m,dd=n,other=false;
if(n<1){mm--;dd=new Date(y,m,0).getDate()+n;other=true;if(mm<0){mm=11;yy--}}
if(n>last){mm++;dd=n-last;other=true;if(mm>11){mm=0;yy++}}
let k=key(yy,mm,dd),holiday=holidays[yy].get(k);
let cell=document.createElement('div');
cell.className='day '+(other?'other ':'')+(k===today?'today ':'')+(holiday?'holiday':'');
cell.onclick=()=>openDay(k);
let num=document.createElement('div');
num.className='num '+(c===5?'sat ':'')+(c===6?'sun':'');
num.textContent=dd;
if(holiday)num.title=holiday;
cell.appendChild(num);
let sv=shifts[k];
if(sv){let si=shiftInfo(sv),s=document.createElement('div');s.className='shift s-'+si[2];s.textContent=si[1];cell.appendChild(s)}
cells.push(cell);ds.appendChild(cell)
}
wk.appendChild(ds);

let ws=new Date(y,m,w*7-first+1),we=new Date(y,m,w*7-first+7);
let wsk=key(ws.getFullYear(),ws.getMonth(),ws.getDate()),wek=key(we.getFullYear(),we.getMonth(),we.getDate());
let pieces=[],lanes=[];
todos.filter(t=>t.title&&t.title.trim()).forEach(t=>{
if(dt(t.end)<dt(wsk)||dt(t.start)>dt(wek))return;
let s=dt(t.start)>dt(wsk)?t.start:wsk,e=dt(t.end)<dt(wek)?t.end:wek,sc=diff(wsk,s),ec=diff(wsk,e),lane=0;
while(lanes[lane]!=null&&lanes[lane]>=sc)lane++;
lanes[lane]=ec;
pieces.push({t,sc,ec,lane,s:t.start===s,e:t.end===e});
});
let many=pieces.length>=3;
cells.forEach(c=>{if(many)c.classList.add('has-many')});
let bs=document.createElement('div');bs.className='bars';
pieces.forEach(p=>{
let b=document.createElement('button');
b.className='bar '+(p.s?'start ':'')+(p.e?'end ':'')+(p.sc===p.ec?'single ':'')+(p.t.done?'done ':'')+(many?'compact':'');
b.style.background=C[p.t.color];
b.style.setProperty('--c',C[p.t.color]);
b.style.left=(p.sc*100/7+0.5)+'%';
b.style.width=(p.ec-p.sc+1)*100/7-1+'%';
b.style.top=(30+p.lane*(many?21:27))+'px';
let l=document.createElement('span');l.className='label';l.textContent=p.s?p.t.title:'';b.appendChild(l);
b.onclick=e=>{e.stopPropagation();open(p.t)};
bs.appendChild(b)
});
wk.appendChild(bs);weeks.appendChild(wk)
}
}

function openDay(selected){open(null,selected)}

function open(t,selected){
let edit=!!t,base=selected||(t?t.start:key(view.getFullYear(),view.getMonth(),1));
let shiftDate=selected||base;
modal.innerHTML='<div class="modalbg"><form class="modal"><h2>'+(edit?'Todoを編集':'Todoを追加')+'</h2>'+
'<div class="field"><label>予定</label><div class="title-row"><input id="done" type="checkbox"><input id="title" type="text" maxlength="50" placeholder="予定を入力してください"></div></div>'+
'<div class="subs"><div class="subhead"><span>サブタスク</span><button type="button" class="subadd" id="sa">＋追加</button></div><div id="sl"></div><div class="subinput" id="si" style="display:none"><input id="sn" placeholder="サブタスクを入力"><button type="button" id="ss">追加</button></div></div>'+
'<div class="field"><label>開始日</label><input id="start" type="date"></div>'+
'<div class="field"><label>終了日</label><input id="end" type="date"></div>'+
'<div class="field"><label>色</label><div class="colors" id="colors"></div></div>'+
'<div class="field"><label>シフト</label><div class="shifts" id="shifts"></div></div>'+
'<div class="actions">'+(edit?'<button type="button" class="delete" id="del">削除</button>':'')+'<button type="button" id="cancel">キャンセル</button><button class="save">保存</button></div></form></div>';

let title=document.getElementById('title'),done=document.getElementById('done'),start=document.getElementById('start'),end=document.getElementById('end'),
sl=document.getElementById('sl'),si=document.getElementById('si'),sn=document.getElementById('sn'),col=document.getElementById('colors'),shiftsEl=document.getElementById('shifts');

title.value=t?t.title:'';done.checked=t?t.done:false;start.value=t?t.start:base;end.value=t?t.end:base;
let subs=t?(t.subs||[]).map(x=>({...x})):[],color=t&&typeof t.color==='number'?t.color:0,shift=t?(shifts[t.start]||''):(shifts[shiftDate]||'');

function draw(){
sl.innerHTML='';
if(!subs.length){sl.innerHTML='<small style="color:#999">サブタスクはありません</small>';return}
subs.forEach(s=>{
let row=document.createElement('div');row.className='subrow '+(s.done?'done':'');
let cb=document.createElement('input');cb.type='checkbox';cb.checked=!!s.done;cb.onchange=()=>{s.done=cb.checked;row.classList.toggle('done',s.done)};
let sp=document.createElement('span');sp.textContent=s.text;
let d=document.createElement('button');d.type='button';d.className='subdel';d.textContent='×';d.onclick=()=>{subs=subs.filter(x=>x.id!==s.id);draw()};
row.append(cb,sp,d);sl.appendChild(row)
})
}
draw();

C.forEach((c,i)=>{
let b=document.createElement('button');b.type='button';b.className='color '+(i===color?'sel':'');b.style.background=c;
b.onclick=()=>{color=i;col.querySelectorAll('.color').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};
col.appendChild(b)
});

SHIFT.forEach(s=>{
let b=document.createElement('button');b.type='button';
b.className='shiftopt sopt-'+s[2]+' '+(s[2]==='none'?'none ':'')+(s[0]===shift?'sel':'');
b.textContent=s[1];
b.onclick=()=>{shift=s[0];shiftsEl.querySelectorAll('.shiftopt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};
shiftsEl.appendChild(b)
});

document.getElementById('sa').onclick=()=>{si.style.display='flex';sn.focus()};
document.getElementById('ss').onclick=()=>{if(sn.value.trim()){subs.push({id:sid++,text:sn.value.trim(),done:false});sn.value='';si.style.display='none';draw()}};
document.getElementById('cancel').onclick=()=>modal.innerHTML='';
modal.querySelector('.modalbg').onclick=e=>{if(e.target===e.currentTarget)modal.innerHTML=''};

if(edit)document.getElementById('del').onclick=()=>{todos=todos.filter(x=>x.id!==t.id);save();modal.innerHTML='';render()};

modal.querySelector('form').onsubmit=e=>{
e.preventDefault();
let v=title.value.trim();
if(!start.value||!end.value||end.value<start.value)return;
if(v){
if(t){
t.title=v;t.done=done.checked;t.start=start.value;t.end=end.value;t.color=color;t.subs=subs;
}else{
todos.push({id:id++,title:v,start:start.value,end:end.value,color,done:done.checked,subs});
}
}
if(shift)shifts[shiftDate]=shift;else delete shifts[shiftDate];
save();modal.innerHTML='';render();
}
}

load();
document.getElementById('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};
document.getElementById('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};
document.getElementById('addtop').onclick=()=>open();
render();
})();
</script>
<script src="shift-import.js?v=9.2"></script>
</body>
</html>
