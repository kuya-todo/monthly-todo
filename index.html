<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monthly Todo 手帳版</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf9f6;color:#403b36;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.app{max-width:1100px;margin:auto;padding:14px 7px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{font-family:Georgia,"Yu Mincho",serif;font-size:23px;margin:0}
button{font:inherit;cursor:pointer}
.nav{display:flex;align-items:center;gap:6px}
.nav button,.add{width:40px;height:40px;border:1px solid #ddd7cf;background:#fffefa;border-radius:10px}
.month{min-width:105px;text-align:center;font-weight:600}
.calendar{background:#fffefa;border:1px solid #ddd7cf;border-radius:9px;overflow:hidden}
.weekhead,.days{display:grid;grid-template-columns:repeat(7,1fr)}
.weekhead div{text-align:center;padding:8px 0;border-right:1px solid #ddd7cf;font-size:11px}
.weekhead div:last-child{border:0}.sun{color:#d84a42}.sat{color:#3169b5}
.week{position:relative;border-bottom:1px solid #ddd7cf}.week:last-child{border:0}
.days{min-height:116px}.day{height:116px;border-right:1px solid #ddd7cf;position:relative;padding:5px 6px}.day:last-child{border:0}
.other{background:#faf8f3}.num{font-size:12px;font-weight:600;position:relative;z-index:10}
.today .num{background:#686d66;color:#fff;border-radius:50%;width:23px;height:23px;display:flex;align-items:center;justify-content:center}
.bars{position:absolute;inset:0;pointer-events:none}
.bar{position:absolute;height:23px;line-height:23px;border:0;border-radius:0;padding:0 7px;color:#49433d;font-size:10px;white-space:nowrap;overflow:visible;z-index:5;pointer-events:auto;text-align:left}
.bar.start{border-radius:4px 0 0 4px}.bar.end{padding-right:18px}
.bar.end:after{content:"";position:absolute;right:-15px;top:0;border-top:11.5px solid transparent;border-bottom:11.5px solid transparent;border-left:15px solid var(--c)}
.bar.done{opacity:.38;text-decoration:line-through}.label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.bar:not(.start) .label{display:none}
.plus{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);border:0;background:transparent;color:#aaa39b;font-size:17px;width:28px;height:27px;border-radius:50%;z-index:8}
.hint{text-align:center;font-size:10px;color:#8d867d;margin:8px}
.modalbg{position:fixed;inset:0;background:#0004;display:flex;align-items:center;justify-content:center;padding:15px;z-index:30}
.modal{background:#fffefa;width:min(460px,100%);max-height:90vh;overflow:auto;border-radius:15px;padding:19px;box-shadow:0 12px 40px #0003}
.modal h2{margin:0 0 14px;font-size:18px}
.field{margin-bottom:11px}.field label{display:block;font-size:11px;color:#777067;margin-bottom:4px}
.title-row{display:flex;align-items:center;gap:9px}
.title-row input[type=checkbox]{width:21px;height:21px;accent-color:#626960;flex:0 0 auto}
.title-row input[type=text]{flex:1}
.field input[type=text],.field input[type=date]{width:100%;height:42px;border:1px solid #d0c8be;border-radius:8px;padding:7px 9px;font-size:15px}
.subs{border:1px solid #e1dad1;background:#faf8f3;border-radius:9px;padding:11px;margin:3px 0 13px}
.subhead{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:7px}
.subadd{border:1px solid #d5cdc3;background:#fff;border-radius:7px;padding:5px 9px}
.subrow{display:flex;gap:6px;align-items:center;background:#f0ece6;border-radius:7px;padding:5px 6px;margin-bottom:5px;font-size:12px}
.subrow span{flex:1}.subrow.done span{text-decoration:line-through;color:#aaa}.subdel{border:0;background:none;color:#a3655e}
.subinput{display:flex;gap:5px;margin-top:6px}.subinput input{flex:1;height:38px;border:1px solid #d0c8be;border-radius:7px;padding:5px}
.colors{display:flex;gap:7px}.color{width:34px;height:34px;border-radius:8px;border:3px solid transparent}.sel{border-color:#4b4641;box-shadow:0 0 0 2px white inset}
.actions{display:flex;gap:7px;margin-top:16px}.actions button{min-height:40px;padding:0 13px;border:1px solid #d0c8be;background:white;border-radius:8px}
.save{background:#626960!important;color:white;border-color:#626960!important}.delete{margin-right:auto;color:#a05f59!important;border-color:#e0c8c3!important}
@media(max-width:650px){.app{padding:10px 5px}h1{font-size:20px}.day,.days{height:116px;min-height:116px}.day{padding:5px 4px}.bar{height:23px;line-height:23px;font-size:9px;padding-left:6px}.bar.end{padding-right:17px}.bar.end:after{right:-15px}.weekhead div{font-size:10px}}
</style>
</head>
<body>
<div class="app">
<header><h1>Monthly Todo</h1><div class="nav"><button id="prev">‹</button><div class="month" id="month"></div><button id="next">›</button></div><button class="add" id="addtop">＋</button></header>
<div class="calendar"><div class="weekhead"><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div><div class="sun">日</div></div><div id="weeks"></div></div>
<div class="hint">帯をタップすると編集　・　予定の左のチェックで完了　・　＋で追加</div>
<div id="modal"></div>
</div>
<script>
(()=> {
const weeks=document.getElementById('weeks'), month=document.getElementById('month'), modal=document.getElementById('modal');
const C=['#ded3c3','#c9d9ca','#cbd9e5','#e9a8b2','#f1d18a','#d9d1df'];
let view=new Date(2026,7,1), id=10, sid=20;
let todos=[
{id:1,title:'書類確認',start:'2026-08-01',end:'2026-08-05',color:0,done:false,subs:[
{id:1,text:'記入漏れを確認',done:true},{id:2,text:'必要書類をそろえる',done:false}]},
{id:2,title:'保育計画',start:'2026-08-03',end:'2026-08-07',color:1,done:false,subs:[]},
{id:3,title:'運動会の準備',start:'2026-08-10',end:'2026-08-14',color:2,done:false,subs:[]},
{id:4,title:'園だより作成',start:'2026-08-18',end:'2026-08-21',color:3,done:false,subs:[]}
];
function pad(n){return String(n).padStart(2,'0')}
function key(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function dt(k){let a=k.split('-').map(Number);return new Date(Date.UTC(a[0],a[1]-1,a[2]))}
function diff(a,b){return Math.round((dt(b)-dt(a))/86400000)}
function save(){localStorage.setItem('monthlyTodo',JSON.stringify(todos))}
function load(){try{const x=JSON.parse(localStorage.getItem('monthlyTodo'));if(Array.isArray(x))todos=x}catch(e){}}
function render(){
let y=view.getFullYear(),m=view.getMonth();month.textContent=y+'年 '+(m+1)+'月';weeks.innerHTML='';
let first=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate(),rows=Math.ceil((first+last)/7);
let now=new Date(),today=key(now.getFullYear(),now.getMonth(),now.getDate());
for(let w=0;w<rows;w++){
let wk=document.createElement('div');wk.className='week',ds=document.createElement('div');ds.className='days';
for(let c=0;c<7;c++){
let n=w*7+c-first+1,yy=y,mm=m,dd=n,other=false;
if(n<1){mm--;dd=new Date(y,m,0).getDate()+n;other=true;if(mm<0){mm=11;yy--}}
if(n>last){mm++;dd=n-last;other=true;if(mm>11){mm=0;yy++}}
let cell=document.createElement('div');cell.className='day '+(other?'other ':'')+(key(yy,mm,dd)==today?'today':'');
let num=document.createElement('div');num.className='num '+(c==5?'sat ':'')+(c==6?'sun':'');num.textContent=dd;cell.appendChild(num);
let plus=document.createElement('button');plus.className='plus';plus.textContent='+';plus.onclick=()=>open(null,key(yy,mm,dd));cell.appendChild(plus);ds.appendChild(cell)}
wk.appendChild(ds);
let ws=new Date(y,m,w*7-first+1),we=new Date(y,m,w*7-first+7),wsk=key(ws.getFullYear(),ws.getMonth(),ws.getDate()),wek=key(we.getFullYear(),we.getMonth(),we.getDate());
let pieces=[],lanes=[];
todos.forEach(t=>{
if(dt(t.end)<dt(wsk)||dt(t.start)>dt(wek))return;
let s=dt(t.start)>dt(wsk)?t.start:wsk,e=dt(t.end)<dt(wek)?t.end:wek,sc=diff(wsk,s),ec=diff(wsk,e),lane=0;
while(lanes[lane]!=null&&lanes[lane]>=sc)lane++;lanes[lane]=ec;
pieces.push({t,sc,ec,lane,s:t.start==s,e:t.end==e});
});
let bs=document.createElement('div');bs.className='bars';
pieces.forEach(p=>{
let b=document.createElement('button');b.className='bar '+(p.s?'start ':'')+(p.e?'end ':'')+(p.t.done?'done':'');
b.style.background=C[p.t.color];b.style.setProperty('--c',C[p.t.color]);
b.style.left=(p.sc*100/7+4)+'%';b.style.width=(p.ec-p.sc+1)*100/7+'%';b.style.top=(30+p.lane*27)+'px';
let l=document.createElement('span');l.className='label';l.textContent=p.s?p.t.title:'';b.appendChild(l);
b.onclick=e=>{e.stopPropagation();open(p.t)};bs.appendChild(b)
});
wk.appendChild(bs);wk.style.minHeight=(116+Math.max(0,lanes.length-1)*27)+'px';weeks.appendChild(wk)
}}
function open(t,selected){
let edit=!!t,base=selected||(t?t.start:key(view.getFullYear(),view.getMonth(),1));
modal.innerHTML='<div class="modalbg"><form class="modal"><h2>'+(edit?'Todoを編集':'Todoを追加')+'</h2>'+
'<div class="field"><label>予定</label><div class="title-row"><input id="done" type="checkbox"><input id="title" type="text" maxlength="50" placeholder="例：書類確認"></div></div>'+
'<div class="subs"><div class="subhead"><span>サブタスク</span><button type="button" class="subadd" id="sa">＋追加</button></div><div id="sl"></div><div class="subinput" id="si" style="display:none"><input id="sn" placeholder="サブタスクを入力"><button type="button" id="ss">追加</button></div></div>'+
'<div class="field"><label>開始日</label><input id="start" type="date"></div><div class="field"><label>終了日</label><input id="end" type="date"></div>'+
'<div class="field"><label>色</label><div class="colors" id="colors"></div></div>'+
'<div class="actions">'+(edit?'<button type="button" class="delete" id="del">削除</button>':'')+'<button type="button" id="cancel">キャンセル</button><button class="save">保存</button></div></form></div>';
let title=document.getElementById('title'),done=document.getElementById('done'),start=document.getElementById('start'),end=document.getElementById('end'),sl=document.getElementById('sl'),si=document.getElementById('si'),sn=document.getElementById('sn'),col=document.getElementById('colors');
title.value=t?t.title:'';done.checked=t?t.done:false;start.value=t?t.start:base;end.value=t?t.end:base;
let subs=t?t.subs.map(x=>({...x})):[],color=t?t.color:0;
function draw(){sl.innerHTML='';if(!subs.length){sl.innerHTML='<small style="color:#999">サブタスクはありません</small>';return}
subs.forEach(s=>{let row=document.createElement('div');row.className='subrow '+(s.done?'done':'');let cb=document.createElement('input');cb.type='checkbox';cb.checked=s.done;cb.onchange=()=>{s.done=cb.checked;row.classList.toggle('done',s.done)};let sp=document.createElement('span');sp.textContent=s.text;let d=document.createElement('button');d.type='button';d.className='subdel';d.textContent='×';d.onclick=()=>{subs=subs.filter(x=>x.id!=s.id);draw()};row.append(cb,sp,d);sl.appendChild(row)})}
draw();
C.forEach((c,i)=>{let b=document.createElement('button');b.type='button';b.className='color '+(i==color?'sel':'');b.style.background=c;b.onclick=()=>{color=i;col.querySelectorAll('.color').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};col.appendChild(b)});
document.getElementById('sa').onclick=()=>{si.style.display='flex';sn.focus()};
document.getElementById('ss').onclick=()=>{if(sn.value.trim()){subs.push({id:sid++,text:sn.value.trim(),done:false});sn.value='';si.style.display='none';draw()}};
document.getElementById('cancel').onclick=()=>modal.innerHTML='';
modal.querySelector('.modalbg').onclick=e=>{if(e.target==e.currentTarget)modal.innerHTML=''};
if(edit)document.getElementById('del').onclick=()=>{todos=todos.filter(x=>x.id!=t.id);save();modal.innerHTML='';render()};
modal.querySelector('form').onsubmit=e=>{e.preventDefault();let v=title.value.trim();if(!v||!start.value||!end.value||end.value<start.value)return;
if(t){t.title=v;t.done=done.checked;t.start=start.value;t.end=end.value;t.color=color;t.subs=subs}
else todos.push({id:id++,title:v,start:start.value,end:end.value,color,done:done.checked,subs});
save();modal.innerHTML='';render()}
}
load();
document.getElementById('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};
document.getElementById('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};
document.getElementById('addtop').onclick=()=>open();
render();
})();
</script>
</body>
</html>
